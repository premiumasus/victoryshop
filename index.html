<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VICTORY - Real OAuth Auth System</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #08080c;
            color: #fff;
            font-family: 'Kanit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .modal-content {
            background: #0f0f15;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .auth-tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .auth-tab { flex: 1; padding: 10px; cursor: pointer; color: #a0a0ab; font-weight: 600; }
        .auth-tab.active { color: #fff; border-bottom: 2px solid #fff; }

        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; color: #a0a0ab; margin-bottom: 5px; }
        .form-input {
            width: 100%; padding: 10px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; box-sizing: border-box;
        }

        .btn-submit {
            width: 100%; padding: 12px; background: #fff; color: #000; border: none;
            border-radius: 8px; font-weight: 800; cursor: pointer; margin-top: 10px;
        }

        .social-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn-social {
            padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05); color: #fff; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
        }
        .btn-social.google:hover { background: #ea4335; }
        .btn-social.discord:hover { background: #5865F2; }

        /* Pop-up Modals */
        .popup-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <div class="modal-content">
        <div class="auth-tabs">
            <div class="auth-tab active" id="tab-login">เข้าสู่ระบบ</div>
            <div class="auth-tab" id="tab-reg">สมัครสมาชิก</div>
        </div>

        <!-- ฟอร์มเข้าสู่ระบบ -->
        <form id="login-form">
            <div class="form-group">
                <label>อีเมล / ชื่อผู้ใช้</label>
                <input type="text" class="form-input" id="login-user" required>
            </div>
            <div class="form-group">
                <label>รหัสผ่าน</label>
                <input type="password" class="form-input" id="login-pass" required>
            </div>
            <button type="submit" class="btn-submit">เข้าสู่ระบบ</button>
        </form>

        <!-- ฟอร์มสมัครสมาชิก -->
        <form id="reg-form" style="display: none;">
            <div class="form-group">
                <label>ชื่อผู้ใช้</label>
                <input type="text" class="form-input" id="reg-user" required>
            </div>
            <div class="form-group">
                <label>อีเมล</label>
                <input type="email" class="form-input" id="reg-email" required>
            </div>
            <div class="form-group">
                <label>รหัสผ่าน</label>
                <input type="password" class="form-input" id="reg-pass" required>
            </div>
            <button type="submit" class="btn-submit">สมัครสมาชิก</button>
        </form>

        <div style="margin: 15px 0 10px; color: #a0a0ab; font-size: 0.8rem;">หรือดำเนินการต่อด้วย</div>

        <!-- ปุ่ม Google / Discord เข้าสู่ระบบของจริง (ลิงก์ไปที่ Backend API) -->
        <div class="social-buttons">
            <a href="/auth/google" class="btn-social google">
                <i class="fa-brands fa-google"></i> Google
            </a>
            <a href="/auth/discord" class="btn-social discord">
                <i class="fa-brands fa-discord"></i> Discord
            </a>
        </div>
    </div>

    <!-- POPUP แจ้งเตือนสำเร็จ -->
    <div class="popup-modal" id="alertModal">
        <div class="modal-content" style="max-width: 300px;">
            <div style="font-size: 3rem; color: #00ff88; margin-bottom: 10px;" id="alert-icon">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h3 id="alert-title">สำเร็จ!</h3>
            <p id="alert-msg" style="color: #a0a0ab; font-size: 0.9rem;"></p>
            <button class="btn-submit" onclick="closeAlert()">ตกลง</button>
        </div>
    </div>

    <script>
        const tabLogin = document.getElementById('tab-login');
        const tabReg = document.getElementById('tab-reg');
        const loginForm = document.getElementById('login-form');
        const regForm = document.getElementById('reg-form');

        tabLogin.addEventListener('click', () => {
            tabLogin.classList.add('active'); tabReg.classList.remove('active');
            loginForm.style.display = 'block'; regForm.style.display = 'none';
        });

        tabReg.addEventListener('click', () => {
            tabReg.classList.add('active'); tabLogin.classList.remove('active');
            regForm.style.display = 'block'; loginForm.style.display = 'none';
        });

        function showAlert(title, msg) {
            document.getElementById('alert-title').textContent = title;
            document.getElementById('alert-msg').textContent = msg;
            document.getElementById('alertModal').style.display = 'flex';
        }

        function closeAlert() {
            document.getElementById('alertModal').style.display = 'none';
        }

        // แจ้งเตือนเมื่อสมัครสมาชิกสำเร็จ
        regForm.addEventListener('submit', (e) => {
            e.preventDefault();
            showAlert('สมัครสมาชิกสำเร็จ!', 'บัญชีของคุณถูกสร้างเรียบร้อยแล้ว');
            regForm.reset();
        });

        // แจ้งเตือนเมื่อเข้าสู่ระบบสำเร็จ
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            showAlert('เข้าสู่ระบบสำเร็จ!', 'ยินดีต้อนรับเข้าสู่ระบบ');
            loginForm.reset();
        });

        // ตรวจสอบ Parameter จาก URL หากกลับมาจาก Google/Discord OAuth
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('auth') === 'success') {
                showAlert('เข้าสู่ระบบสำเร็จ!', 'เข้าสู่ระบบด้วย Google / Discord เรียบร้อย');
            }
        });
    </script>
</body>
</html>
